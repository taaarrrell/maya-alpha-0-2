<!doctype html>
<html lang="en" data-mode="maya">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>M.A.Y.A. — Alpha 0.2</title>
<link rel="stylesheet" href="ui.css">

</head>
<body>
<main>
<header><div class="brand" aria-label="M.A.Y.A.">M.A.Y.A.</div><div class="micro version">ALPHA 0.2</div></header>
<section class="stage" aria-labelledby="mode-title">
<canvas aria-hidden="true"></canvas>
<img id="form-image" alt="" hidden>
<div class="stage-top micro"><span id="embodiment-label">NANOSWARM</span><span class="signal">SIMULATED</span></div>
<div class="stage-bottom"><div><h1 id="mode-title">M.A.Y.A.</h1><p id="mode-description">Crimson · Organic swarm</p></div></div>
</section>
<nav aria-label="Visual protocols">
<button type="button" class="mode" data-key="maya" aria-pressed="true">M.A.Y.A.</button>
<button type="button" class="mode" data-key="phineas" aria-pressed="false">PHINEAS</button>
<button type="button" class="mode" data-key="dream" aria-pressed="false">DREAM</button>
</nav>
<div class="controls">
  <label>Connection mode<select id="connection" disabled><option value="simulated">Simulated</option><option value="live">Live</option></select></label>
  <label>Embodiment<select id="embodiment"><option value="swarm">Nanoswarm</option></select></label>
</div>
<p id="quota" class="micro" role="status" hidden></p>
<section aria-labelledby="chat-title">
<div class="chat-head"><h2 id="chat-title">Conversation</h2><button type="button" class="reset" disabled>Reset</button></div>
<div class="log" role="log" aria-label="Conversation history" tabindex="0"></div>
<form class="composer">
<label class="sr" for="message">Your message</label><input id="message" maxlength="2000" disabled required placeholder="Say something…" enterkeyhint="send" autocomplete="off"><button type="submit" class="send" disabled>Send</button>
</form>
<p id="pending" role="status"></p>
<p id="feedback" role="alert"></p>
<p id="storage-status" class="micro" role="status" hidden></p>
<footer id="scope" class="micro">M.A.Y.A. · Session preview</footer>
<details id="identity" hidden><summary>Identity</summary><div class="identity-content"></div></details>
</section>
</main>
<script src="swarm.js" defer></script>
<script src="ui.js" defer></script>
<script src="../shared/adapter.js" defer></script>
<script src="../shared/identity.js" defer></script>
<script src="synthetic-bootstrap.js" defer></script>
</body>
</html>
